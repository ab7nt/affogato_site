<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#07090c">
  <title>Аффогато</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/favicons/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="assets/favicons/favicon-16.png" type="image/png" sizes="16x16">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="mask-icon" href="assets/favicons/safari-pinned-tab.svg" color="#0c161b">
  <link rel="manifest" href="site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poiret+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="stage"></canvas>

  <nav id="top-nav" class="top-nav" aria-label="Основная навигация">
    <a href="https://band.link/affogato" target="_blank" rel="noopener noreferrer">послушать</a>
    <a href="mailto:affogato.sound@gmail.com">написать</a>
  </nav>

  <button id="scroll-hint" class="scroll-hint" type="button" aria-label="Погрузиться глубже">
    <span>погрузиться</span>
    <span class="scroll-hint__sub">лучше скроллить, но можно и нажать</span>
    <span class="scroll-hint__arrow"></span>
  </button>

  <button id="polaroid-return" class="return-hint return-hint--polaroid" type="button" aria-label="Вернуться">
    <span class="return-hint__arrow" aria-hidden="true"></span>
    <span class="return-hint__sub">лучше скроллить, но можно и нажать</span>
    <span class="return-hint__label">вернуться</span>
  </button>

  <button id="surface-hint" class="surface-hint" type="button" aria-label="Вернуться на поверхность">
    <span class="surface-hint__arrows" aria-hidden="true"></span>
  </button>

  <div id="titles" class="titles" aria-hidden="true">
    <div id="title-group" class="titles__group"></div>
    <div id="title-album" class="titles__album"></div>
  </div>

  <div id="loader">
    <div class="loader__text">загрузка</div>
    <div class="loader__progress" id="loader-progress">0%</div>
  </div>

  <canvas id="transit-overlay" class="transit-overlay" aria-hidden="true"></canvas>

  <!-- Classic-скрипты по порядку: ES-модули не работают через file:// в Chrome.
       Общий неймспейс — window.Affogato. -->
  <script src="js/config.js"></script>
  <script src="js/viewport.js"></script>
  <script src="js/preloader.js"></script>
  <script src="js/smooth-scroll.js"></script>
  <script src="js/title-overlay.js"></script>
  <script src="js/scene-manager.js"></script>
  <script src="js/underwater-bg.js"></script>
  <script src="js/transit.js"></script>
  <script src="js/scenes/diving.js"></script>
  <script src="js/scenes/polaroid.js"></script>
  <script src="js/scenes/stone-video.js"></script>
  <script src="js/player.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
